# GitLab CI for Gluten Flink
# Only triggers when gluten-flink/** or .github/workflows/flink.yml has changes

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - gluten-flink/**/*
        - .github/workflows/flink.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - gluten-flink/**/*
        - .github/workflows/flink.yml

variables:
  MAVEN_OPTS: >-
    -Xmx20g
    --add-opens=java.base/java.nio=org.apache.arrow.memory.core,ALL-UNNAMED
    --add-opens=java.base/sun.nio.ch=org.apache.arrow.memory.core,ALL-UNNAMED
    --add-opens=java.base/java.lang=ALL-UNNAMED
    --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
    --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
    --add-opens=java.base/java.io=ALL-UNNAMED
    --add-opens=java.base/java.net=ALL-UNNAMED
    --add-opens=java.base/java.util=ALL-UNNAMED
    --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
    --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED
    --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED
  JAVA_TOOL_OPTIONS: >-
    --add-opens=java.base/java.nio=org.apache.arrow.memory.core,ALL-UNNAMED
    --add-opens=java.base/sun.nio.ch=org.apache.arrow.memory.core,ALL-UNNAMED
    --add-opens=java.base/java.lang=ALL-UNNAMED
    --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
    --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
    --add-opens=java.base/java.io=ALL-UNNAMED
    --add-opens=java.base/java.net=ALL-UNNAMED
    --add-opens=java.base/java.util=ALL-UNNAMED
    --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
    --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED
    --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED
  CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"

stages:
  - prepare
  - build
  - test

cache:
  key: ccache-flink-$CI_COMMIT_SHA
  paths:
    - .ccache/

prepare:
  stage: prepare
  image: apache/gluten:centos-8-jdk17
  rules:
    - changes:
        - gluten-flink/**/*
        - .github/workflows/flink.yml
  before_script:
    - source /opt/rh/gcc-toolset-11/enable
    - dnf install -y patchelf ccache
    - export CCACHE_DIR=${CCACHE_DIR}
    - export CCACHE_MAXSIZE=4G
    - mkdir -p ${CCACHE_DIR}
    - ccache -sz
    - yum install https://mirror.stream.centos.org/9-stream/BaseOS/x86_64/os/Packages/tzdata-2026a-1.el9.noarch.rpm -y
    - .github/workflows/util/install-flink-deps.sh
    - rm -rf /usr/local/include/fmt
    - rm -rf /usr/local/lib/cmake/fmt
    - rm -f /usr/local/lib/libfmt* /usr/local/lib64/libfmt*
    - export VELOX_DEPENDENCY_SOURCE=BUNDLED
    - export fmt_SOURCE=BUNDLED
    - export folly_SOURCE=BUNDLED
  script:
    - git clone -b gluten-0530 https://github.com/bigo-sg/velox4j.git
    - cd velox4j && git reset --hard 97fc1edafebd0f505e613d260f77f92f5252d048
    - git apply $CI_PROJECT_DIR/gluten-flink/patches/fix-velox4j.patch
    - $CI_PROJECT_DIR/build/mvn clean install -DskipTests -Dgpg.skip -Dspotless.skip=true
    - cd ..
    - git clone https://github.com/nexmark/nexmark.git
    - cd nexmark
    - $CI_PROJECT_DIR/build/mvn clean install -DskipTests
    - ccache -s
  artifacts:
    paths:
      - velox4j/
    expire_in: 1 hour

build:
  stage: build
  image: apache/gluten:centos-8-jdk17
  rules:
    - changes:
        - gluten-flink/**/*
        - .github/workflows/flink.yml
  needs:
    - prepare
  script:
    - cd $CI_PROJECT_DIR/gluten-flink
    - $CI_PROJECT_DIR/build/mvn clean package -Dmaven.test.skip=true
  artifacts:
    paths:
      - gluten-flink/*/target/*.jar
    expire_in: 1 hour

test:
  stage: test
  image: apache/gluten:centos-8-jdk17
  rules:
    - changes:
        - gluten-flink/**/*
        - .github/workflows/flink.yml
  needs:
    - build
  script:
    - cd $CI_PROJECT_DIR/gluten-flink
    - $CI_PROJECT_DIR/build/mvn test

tags:
    - gluten-flink

